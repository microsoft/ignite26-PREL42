[project]
name = "agent-workiq-maf"
version = "0.1.0"
description = "Local and hosted Agent Framework assistant using direct Work IQ MCP and per-user authentication"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.20.0,<1.21.0",
    "agent-framework-foundry>=1.14.0,<1.15.0",
    "agent-framework-foundry-hosting==1.0.0b261008",
    "azure-ai-agentserver-responses>=1.0.0b8",
    "azure-identity>=1.25.3",
    "azure-monitor-opentelemetry>=1.8.7",
    "httpx>=0.28.1",
    "mcp>=1.28.1",
    "msal>=1.31.0",
    "python-dotenv>=1.2.2",
]

[tool.uv]
package = false
